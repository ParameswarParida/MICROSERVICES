spring.application.name=greet-api

server.port=8082
spring.boot.admin.client.url=http://localhost:1111/
management.endpoints.web.exposure.include=*


resilience4j.retry.instances.welcomeService.max-attempts=3
resilience4j.retry.instances.welcomeService.wait-duration=2s

# ==============================
# Circuit Breaker
# ==============================

resilience4j.circuitbreaker.instances.welcomeService.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.instances.welcomeService.sliding-window-size=5

resilience4j.circuitbreaker.instances.welcomeService.failure-rate-threshold=50

resilience4j.circuitbreaker.instances.welcomeService.wait-duration-in-open-state=10s

resilience4j.circuitbreaker.instances.welcomeService.permitted-number-of-calls-in-half-open-state=2

management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always