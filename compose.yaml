services:
  eureka:
    image: microservices/eureka:latest
    build:
      context: .
      args:
        SERVICE_MODULE: service_registry
    ports:
      - "8761:8761"

  admin-server:
    image: microservices/admin-server:latest
    build:
      context: .
      args:
        SERVICE_MODULE: admin_server
    ports:
      - "1111:1111"

  kafka:
    image: apache/kafka:4.1.1
    hostname: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 1

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  auth-service:
    image: microservices/auth-service:latest
    build:
      context: .
      args:
        SERVICE_MODULE: auth-service
    depends_on:
      - eureka
      - postgres
    ports:
      - "8083:8083"
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka:8761/eureka/
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-postgres}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      JWT_SECRET: ${JWT_SECRET:-}

  gateway-service:
    image: microservices/gateway-service:latest
    build:
      context: .
      args:
        SERVICE_MODULE: gateway-service
    depends_on:
      - eureka
      - welcome-service
      - greet-api
      - auth-service
    ports:
      - "8888:8888"
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka:8761/eureka/
      JWT_SECRET: ${JWT_SECRET:-}

  greet-api:
    image: microservices/greet-api:latest
    build:
      context: .
      args:
        SERVICE_MODULE: greet_api
    depends_on:
      - eureka
      - admin-server
    ports:
      - "8082:8082"
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka:8761/eureka/
      SPRING_BOOT_ADMIN_CLIENT_URL: http://admin-server:1111/

  welcome-service:
    image: microservices/welcome-service:latest
    build:
      context: .
      args:
        SERVICE_MODULE: welcome_service
    depends_on:
      - eureka
      - kafka
      - admin-server
    ports:
      - "8081:8081"
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka:8761/eureka/
      SPRING_BOOT_ADMIN_CLIENT_URL: http://admin-server:1111/
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SPRING_BOOT_ADMIN_CLIENT_ENABLED: "false"

volumes:
  postgres_data:
