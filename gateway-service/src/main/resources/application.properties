spring.application.name=gateway-service
server.port=8888

# Use the same Base64-encoded JWT_SECRET as auth-service.
jwt.secret=${JWT_SECRET:}

# =========================
# Welcome service
# =========================
spring.cloud.gateway.server.webflux.routes[0].id=welcome-service
spring.cloud.gateway.server.webflux.routes[0].uri=lb://WELCOME-SERVICE
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/welcome/**

spring.cloud.gateway.server.webflux.routes[1].id=greet-service
spring.cloud.gateway.server.webflux.routes[1].uri=lb://GREET-API
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/greet/**

spring.cloud.gateway.server.webflux.routes[2].id=auth-service
spring.cloud.gateway.server.webflux.routes[2].uri=lb://AUTH-SERVICE
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/auth/**
